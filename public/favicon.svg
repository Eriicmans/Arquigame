<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chipAccent" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#18181b" stroke="#27272a" stroke-width="2" />

  <!-- Top & bottom IC pins -->
  <path d="M22 10v6M32 10v6M42 10v6M22 48v6M32 48v6M42 48v6" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
  <!-- Left & right IC pins -->
  <path d="M10 22h6M10 32h6M10 42h6M48 22h6M48 32h6M48 42h6" stroke="#71717a" stroke-width="3" stroke-linecap="round" />

  <!-- Chip package -->
  <rect x="16" y="16" width="32" height="32" rx="7" fill="#09090b" stroke="url(#chipAccent)" stroke-width="2.5" />

  <!-- Inner silicon die / stylized "A" & logic trace -->
  <path
    d="M25 40L32 23L39 40M27.8 34.5H36.2"
    stroke="url(#chipAccent)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="23" r="2.2" fill="#34d399" />
</svg>
